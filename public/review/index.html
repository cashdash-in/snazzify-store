<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Review your order · Snazzify</title>
<link rel="icon" href="/snazzify-icon.svg">
<meta name="theme-color" content="#111014">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F4EF;--ink:#111014;--muted:#6E6A75;--line:#E5E1D8;--lime:#D7FF3B;--mint:#BDF5DD;--red:#E5383B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.w{max-width:460px;margin:0 auto;padding:22px 18px 40px;display:grid;gap:16px}
.logo{height:30px;margin:0 auto}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;letter-spacing:-.04em;line-height:1}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px}
.it{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}
.it img{width:64px;height:78px;object-fit:cover;border-radius:12px;background:#eee}
.it b{font-size:15px;display:block;line-height:1.25}.it small{color:var(--muted);font-size:13px}
.tot{display:flex;justify-content:space-between;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;border-top:1px dashed var(--line);padding-top:12px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;background:var(--ink);color:#fff;font:inherit;font-weight:800;font-size:16.5px;border:0;border-radius:16px;padding:17px;width:100%;cursor:pointer}
.btn:disabled{opacity:.6}
.trust{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.trust span{font-size:11.5px;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fff}
.note{font-size:13.5px;color:var(--muted);line-height:1.55;text-align:center}
.err{color:var(--red);font-weight:700;font-size:14px;text-align:center}
.ok{background:var(--lime);border-radius:16px;padding:16px;font-weight:700;text-align:center;line-height:1.5}
.free{font-size:12px;font-weight:800;background:var(--mint);border-radius:999px;padding:4px 9px}
.ok{background:var(--lime);border-radius:16px;padding:16px;font-weight:700;text-align:center;line-height:1.5}
.pick{display:grid;gap:8px}.pick label{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px;cursor:pointer}
.pick label.on{border-color:var(--ink)}.pick img{width:56px;height:66px;object-fit:cover;border-radius:10px}.pick input{display:none}.pick small{color:#1f7a4d;font-weight:800}
.stars{display:flex;gap:6px;justify-content:center}.stars button{font-size:40px;background:none;border:0;cursor:pointer;color:#ddd;line-height:1}.stars button.on{color:#f5a400}
textarea,input[type=text]{font:inherit;font-size:16px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);width:100%;background:#fff}
.ph{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px dashed var(--ink);border-radius:14px;padding:14px;font-weight:700;cursor:pointer;background:#fff}
.prev{width:100%;border-radius:14px;max-height:320px;object-fit:cover}
</style>
</head>
<body>
<div class="w" id="w"><img class="logo" src="/snazzify-logo.svg" alt="Snazzify"><p class="note">Loading…</p></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const [ref, t] = (location.hash.slice(1) || '').split('.');
const head = '<img class="logo" src="/snazzify-logo.svg" alt="Snazzify">';
const fail = m => $('#w').innerHTML = head + `<h1>Hmm.</h1><p class="err">${esc(m)}</p><p class="note"><a href="/">Back to the shop</a></p>`;
let O, pid, stars = 0, photo = '';

async function resize(file){
  const bmp = await createImageBitmap(file); const k = Math.min(1, 1000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', .82);
}
function draw(){
  const left = O.items.filter(i => !i.done);
  if (!left.length) { $('#w').innerHTML = head + `<div style="font-size:54px;text-align:center">💛</div><h1>Thank you, ${esc(O.firstName)}!</h1><div class="ok">Your review is in. Once approved, it appears on Snazzify for other shoppers.</div><p class="note"><a href="/">See today's drop →</a></p>`; return; }
  if (!left.find(i => i.id === pid)) pid = left[0].id;
  $('#w').innerHTML = head + `<h1>How was it, ${esc(O.firstName)}?</h1>
    <p class="note" style="text-align:left">Your review (and a photo, if you like) helps other shoppers. Takes 30 seconds.</p>
    <div class="pick">${O.items.map(i => `<label class="${i.id===pid?'on':''}"><input type="radio" name="p" value="${i.id}" ${i.done?'disabled':''} ${i.id===pid?'checked':''}><img src="/img/${esc(i.img)}" alt=""><b>${esc(i.name)}</b>${i.done?'<small>✓ Done</small>':''}</label>`).join('')}</div>
    <div class="stars">${[1,2,3,4,5].map(n => `<button type="button" data-s="${n}" class="${n<=stars?'on':''}" aria-label="${n} stars">★</button>`).join('')}</div>
    <textarea id="tx" rows="4" maxlength="600" placeholder="What did you love? How was the fit, fabric and colour?"></textarea>
    <input type="text" id="ct" placeholder="Your city" value="${esc(O.city||'')}">
    ${photo ? `<img class="prev" src="${photo}" alt="">` : ''}
    <label class="ph">📸 ${photo ? 'Change photo' : 'Add a photo of you wearing it (optional)'}<input type="file" accept="image/*" id="ph" hidden></label>
    <div class="err" id="err"></div>
    <button class="btn" id="go">Post my review</button>
    <p class="note">By posting, you agree we may show your first name, city, review and photo on snazzify.co.in.</p>`;
  document.querySelectorAll('.pick input').forEach(r => r.onchange = () => { pid = r.value; keep(); draw(); });
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { stars = +b.dataset.s; keep(); draw(); });
  $('#tx').value = keep.tx || ''; $('#ct').value = keep.ct ?? O.city ?? '';
  $('#ph').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { keep(); photo = await resize(f); draw(); } catch { $('#err').textContent = 'Could not read that photo.'; } };
  $('#go').onclick = send;
}
function keep(){ const tx = $('#tx'), ct = $('#ct'); if (tx) keep.tx = tx.value; if (ct) keep.ct = ct.value; }
async function send(){
  keep(); const err = $('#err'), btn = $('#go'); err.textContent = '';
  if (!stars) { err.textContent = 'Tap the stars to rate it.'; return; }
  if ((keep.tx || '').trim().length < 3) { err.textContent = 'Please write a few words.'; return; }
  btn.disabled = true; btn.textContent = 'Posting…';
  try {
    const r = await fetch('/api/review', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ ref, t, pid, stars, text: keep.tx, city: keep.ct, photo }) });
    const o = await r.json(); if (!r.ok) throw new Error(o.error || 'Could not post');
    O.items.find(i => i.id === pid).done = true; stars = 0; photo = ''; keep.tx = ''; draw();
  } catch (e) { btn.disabled = false; btn.textContent = 'Post my review'; err.textContent = e.message; }
}
(async () => {
  const r = await fetch(`/api/review?ref=${encodeURIComponent(ref||'')}&t=${encodeURIComponent(t||'')}`);
  O = await r.json().catch(() => ({}));
  if (!r.ok) return fail(O.error || 'This review link is not valid.');
  draw();
})();
</script>
</body>
</html>
