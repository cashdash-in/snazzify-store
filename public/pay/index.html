<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Complete your order · Snazzify</title>
<link rel="icon" href="/snazzify-icon.svg">
<meta name="theme-color" content="#111014">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F4EF;--ink:#111014;--muted:#6E6A75;--line:#E5E1D8;--lime:#D7FF3B;--mint:#BDF5DD;--red:#E5383B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.w{max-width:460px;margin:0 auto;padding:22px 18px 40px;display:grid;gap:16px}
.logo{height:30px;margin:0 auto}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:34px;letter-spacing:-.04em;line-height:1}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px}
.it{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}
.it img{width:64px;height:78px;object-fit:cover;border-radius:12px;background:#eee}
.it b{font-size:15px;display:block;line-height:1.25}.it small{color:var(--muted);font-size:13px}
.tot{display:flex;justify-content:space-between;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:22px;border-top:1px dashed var(--line);padding-top:12px}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;background:var(--ink);color:#fff;font:inherit;font-weight:800;font-size:16.5px;border:0;border-radius:16px;padding:17px;width:100%;cursor:pointer}
.btn:disabled{opacity:.6}
.trust{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.trust span{font-size:11.5px;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:#fff}
.note{font-size:13.5px;color:var(--muted);line-height:1.55;text-align:center}
.err{color:var(--red);font-weight:700;font-size:14px;text-align:center}
.ok{background:var(--lime);border-radius:16px;padding:16px;font-weight:700;text-align:center;line-height:1.5}
.free{font-size:12px;font-weight:800;background:var(--mint);border-radius:999px;padding:4px 9px}
</style>
</head>
<body>
<div class="w" id="w"><img class="logo" src="/snazzify-logo.svg" alt="Snazzify"><p class="note">Loading your order…</p></div>
<script>
const $ = s => document.querySelector(s);
const rupee = n => '₹' + Math.round(n).toLocaleString('en-IN');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const [ref, t] = (location.hash.slice(1) || '').split('.');
const head = '<img class="logo" src="/snazzify-logo.svg" alt="Snazzify">';
const fail = m => $('#w').innerHTML = head + `<h1>Hmm.</h1><p class="err">${esc(m)}</p><p class="note"><a href="/">Back to the shop</a></p>`;

(async () => {
  const r = await fetch(`/api/pay-order?ref=${encodeURIComponent(ref||'')}&t=${encodeURIComponent(t||'')}`);
  const o = await r.json().catch(() => ({}));
  if (!r.ok) return fail(o.error || 'This payment link is not valid.');
  const items = o.items.map(i => `<div class="it"><img src="/img/${esc(i.img)}" alt=""><div><b>${esc(i.name)}</b>
    <small>${[i.size, i.colour].filter(Boolean).map(esc).join(' · ')}${i.qty>1?' · qty '+i.qty:''}</small></div><b>${rupee(i.price*i.qty)}</b></div>`).join('');
  if (!['booked','video_sent'].includes(o.status)) {
    $('#w').innerHTML = head + `<h1>Already paid 🎉</h1><div class="card">${items}</div><div class="ok">Order ${esc(o.ref)} is confirmed. We'll WhatsApp your tracking once it ships.</div>`;
    return;
  }
  if (o.expired) return fail("This payment link has expired. Message us on WhatsApp and we'll check if your piece is still available.");
  $('#w').innerHTML = head + `<h1>Love it, ${esc(o.firstName)}? 💛</h1>
    <p class="note" style="text-align:left">You've seen the video of your piece. Pay below to confirm. It ships in 3–5 days.</p>
    <div class="card">${items}<div class="tot"><span>To pay</span><span>${rupee(o.amount)}</span></div>
    <div style="text-align:right"><span class="free">Free shipping</span></div></div>
    <button class="btn" id="pay">🔒 Pay ${rupee(o.amount)} securely</button>
    <div class="err" id="err"></div>
    <div class="trust"><span>UPI</span><span>GPay</span><span>PhonePe</span><span>Cards</span><span>Netbanking</span><span>Razorpay secure</span></div>
    <p class="note">Order ${esc(o.ref)} · Questions? Just reply on WhatsApp.</p>`;
  $('#pay').onclick = pay;
})();

function loadRzp(){ return window.Razorpay ? Promise.resolve() : new Promise((ok,no)=>{ const s=document.createElement('script'); s.src='https://checkout.razorpay.com/v1/checkout.js'; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); }
async function pay(){
  const btn = $('#pay'), err = $('#err'); btn.disabled = true; btn.textContent = 'Opening secure payment…'; err.textContent = '';
  try {
    const [, r] = await Promise.all([loadRzp(), fetch('/api/pay-order', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ref, t})})]);
    const o = await r.json(); if (!r.ok) throw new Error(o.error || 'Could not start payment');
    const rzp = new Razorpay({ key: o.keyId, order_id: o.orderId, amount: o.amount, currency: 'INR', name: 'Snazzify', description: 'Order ' + o.ref,
      image: '/snazzify-icon.png', prefill: o.prefill, theme: { color: '#111014' },
      handler: async res => {
        $('#w').innerHTML = head + '<h1>Confirming…</h1><p class="note">Please don\'t close this page.</p>';
        const v = await fetch('/api/verify-payment', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(res)}).then(x=>x.json()).catch(()=>({}));
        $('#w').innerHTML = head + (v.ok
          ? `<div style="font-size:54px;text-align:center">🎉</div><h1>Order confirmed!</h1><div class="ok">Order ${esc(o.ref)} is paid. Your piece ships in 3–5 days and we'll WhatsApp you the tracking.</div><p class="note"><a href="/">Keep shopping →</a></p>`
          : `<h1>Almost there</h1><p class="err">We couldn't confirm the payment automatically. Please don't pay again. Message us on WhatsApp with order ${esc(o.ref)} and payment ID ${esc(res.razorpay_payment_id)}.</p>`);
      },
      modal: { ondismiss: () => { btn.disabled = false; btn.textContent = '🔒 Pay ' + rupee(o.amount/100) + ' securely'; err.textContent = 'Payment cancelled. You can try again.'; } }
    });
    rzp.on('payment.failed', e => { err.textContent = 'Payment failed: ' + (e.error?.description || 'please try again.'); });
    rzp.open();
  } catch(e) { btn.disabled = false; btn.textContent = 'Try again'; err.textContent = e.message; }
}
</script>
</body>
</html>
